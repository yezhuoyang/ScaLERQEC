name: Build wheels and publish to PyPI

on:
  release:
    types: [published]
  workflow_dispatch:   # Allow manual trigger for testing

jobs:
  verify:
    name: Verify release source
    runs-on: ubuntu-latest
    env:
      OMP_NUM_THREADS: "2"
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install . pytest pytest-cov
      - run: python -m pytest tests --cov=scalerqec --cov-fail-under=30
      - run: python -m pytest tests/test_stratified/test_profile.py --cov=scalerqec --cov-report=
      - run: python -m coverage report --include="*/Stratified/profile.py" --fail-under=95
      - run: cmake -S QEPG -B build/native -DCMAKE_BUILD_TYPE=Debug -DSCALERQEC_SANITIZE=ON
      - run: cmake --build build/native --parallel
      - run: ctest --test-dir build/native --output-on-failure

  build-wheels:
    name: Build wheels on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    needs: verify
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install cibuildwheel
        run: pip install cibuildwheel==2.22.0

      - name: Build wheels
        run: python -m cibuildwheel --output-dir wheelhouse
        env:
          # Build for CPython 3.10-3.13
          CIBW_BUILD: "cp310-* cp311-* cp312-* cp313-*"
          # Skip 32-bit and musl builds
          CIBW_SKIP: "*-win32 *-manylinux_i686 *-musllinux*"
          # Build arm64 on macOS (Intel users can install from sdist)
          CIBW_ARCHS_MACOS: "arm64"
          CIBW_TEST_REQUIRES: "pytest"
          CIBW_TEST_COMMAND: "python -m pytest {project}/tests/test_stratified/test_profile.py {project}/tests/test_qepg/test_sampler_contracts.py {project}/tests/test_clifford/test_semantic_regressions.py"
          CIBW_ENVIRONMENT: "OMP_NUM_THREADS=2 MPLBACKEND=Agg"

      - name: Upload wheels
        uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}
          path: ./wheelhouse/*.whl

  build-sdist:
    name: Build source distribution
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Build sdist
        run: |
          pip install build
          python -m build --sdist

      - name: Upload sdist
        uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist/*.tar.gz

  publish:
    name: Publish to PyPI
    needs: [build-wheels, build-sdist]
    runs-on: ubuntu-latest
    if: github.event_name == 'release'
    environment: pypi
    permissions:
      id-token: write   # For trusted publishing

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
