name: Validation
on:
  pull_request:
  push:
    branches: [main, 'codex/**']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  python:
    name: Python ${{ matrix.python }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ['3.10', '3.13']
    env:
      OMP_NUM_THREADS: '2'
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install ".[ldpc]" pytest pytest-cov ruff
      - name: Check Python correctness
        run: python -m ruff check src/scalerqec --select E9,F821,F822,F823
      - name: Run complete test suite
        run: python -m pytest tests --cov=scalerqec --cov-report=term --cov-report=xml --cov-fail-under=30
      - name: Require profile module coverage
        run: python -m pytest tests/test_stratified/test_profile.py --cov=scalerqec --cov-report=
      - run: python -m coverage report --include="*/Stratified/profile.py" --fail-under=95
      - name: Require general-noise estimator coverage
        run: python -m pytest tests/test_stratified/test_general_noise.py tests/test_stratified/test_noise_polynomial.py tests/test_stratified/test_general_noise_oracles.py tests/test_stratified/test_adaptive.py tests/test_stratified/test_response_compilers.py tests/test_stratified/test_large_code_validation.py tests/test_stratified/test_conditional.py tests/test_stratified/test_uniformized.py --cov=scalerqec --cov-report=
      - run: python -m coverage report --include="*/Stratified/general_noise.py" --fail-under=95
      - run: python -m coverage report --include="*/Stratified/noise_polynomial.py" --fail-under=95
      - run: python -m coverage report --include="*/Stratified/confidence.py" --fail-under=95
      - run: python -m coverage report --include="*/Stratified/adaptive.py" --fail-under=95
      - run: python -m coverage report --include="*/Stratified/conditional.py" --fail-under=95
      - run: python -m coverage report --include="*/Stratified/uniformized.py" --fail-under=95
      - name: Verify wheel-facing imports
        run: python -c "from scalerqec.Stratified import Scaler, LERProfile; assert LERProfile([0, 0.5]).evaluate(0.2) == 0.1"
  native:
    name: C++ sanitizers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cmake -S QEPG -B build/native -DCMAKE_BUILD_TYPE=Debug -DSCALERQEC_SANITIZE=ON
      - run: cmake --build build/native --parallel
      - run: ctest --test-dir build/native --output-on-failure
